name: mr_smart
description: "MrSmart — learn smart-home control with a simulated room or Home Assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  talker_flutter: ^5.1.20
  talker_dio_logger: ^5.1.20
  skeletonizer: ^3.0.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true

  fonts:
    # Tajawal (SIL Open Font License 1.1) for Arabic text.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
